services:
  - type: web
    name: civic-voice-lab-demo-api
    runtime: python
    plan: free
    rootDir: React/Back end
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANON_SALT
        value: civic-voice-lab-demo
      - key: CORS_ORIGINS
        sync: false
      - key: DELIBERATION_DB_MODE
        value: aura
      - key: DELIBERATION_NEO4J_URI
        sync: false
      - key: DELIBERATION_NEO4J_USER
        sync: false
      - key: DELIBERATION_NEO4J_PASSWORD
        sync: false
      - key: DELIBERATION_NEO4J_DATABASE
        sync: false
      - key: SENTIMENT_PROVIDER
        value: ai
      - key: SENTIMENT_LLM_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: FEEDBACK_EMAIL_FROM
        sync: false
      - key: FEEDBACK_EMAIL_TO
        sync: false
